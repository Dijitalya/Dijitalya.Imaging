name: Extended mutation tests
on:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 1'
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGING_FUZZ_ITERATIONS: '10000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test --configuration Release --filter FullyQualifiedName~DamagedFileTests --logger trx --blame-hang-timeout 2m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-test-results
          path: '**/TestResults/*.trx'
